name: build

on: [push, pull_request]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ZPICOTLS_DIR: ${{ github.workspace }}/zpicotls
  ZNGTCP2_DIR: ${{ github.workspace }}/zngtcp2

jobs:
  cmake:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        path: zngtcp2
        submodules: recursive

    - uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/zpicotls
        path: zpicotls
        submodules: recursive

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake \
          pkg-config \
          libssl-dev

    - name: Build zpicotls
      run: |
        cmake -S "$ZPICOTLS_DIR" -B "$ZPICOTLS_DIR/build" \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DWITH_FUSION=OFF
        cmake --build "$ZPICOTLS_DIR/build" --target zpicotls-core zpicotls-openssl -j"$(nproc)"

    - name: Configure zngtcp2
      run: |
        cmake -S "$ZNGTCP2_DIR" -B "$ZNGTCP2_DIR/build" \
          -DENABLE_WERROR=ON \
          -DZPICOTLS_INCLUDE_DIR="$ZPICOTLS_DIR/include" \
          -DZPICOTLS_LIBRARIES="$ZPICOTLS_DIR/build/libzpicotls-openssl.a;$ZPICOTLS_DIR/build/libzpicotls-core.a"

    - name: Build zngtcp2
      run: |
        cmake --build "$ZNGTCP2_DIR/build" --target main zpicotls_test -j"$(nproc)"

    - name: Test zngtcp2
      run: |
        ctest --test-dir "$ZNGTCP2_DIR/build" --output-on-failure

  autotools:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        path: zngtcp2
        submodules: recursive

    - uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/zpicotls
        path: zpicotls
        submodules: recursive

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf \
          automake \
          autotools-dev \
          libtool \
          make \
          pkg-config \
          libssl-dev

    - name: Build zpicotls
      run: |
        cmake -S "$ZPICOTLS_DIR" -B "$ZPICOTLS_DIR/build" \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DWITH_FUSION=OFF
        cmake --build "$ZPICOTLS_DIR/build" --target zpicotls-core zpicotls-openssl -j"$(nproc)"

    - name: Build and test zngtcp2
      working-directory: ${{ env.ZNGTCP2_DIR }}
      run: |
        autoreconf -i -W error
        ./configure --disable-dependency-tracking --enable-lib-only \
          ZPICOTLS_CFLAGS="-I$ZPICOTLS_DIR/include" \
          ZPICOTLS_LIBS="-L$ZPICOTLS_DIR/build -lzpicotls-openssl -lzpicotls-core"
        make -j"$(nproc)"
        make check
